name: Validate Waydefine search

on:
  push:
    branches: [main]
  pull_request:

jobs:
  search-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m py_compile app.py job_search.py career_search.py matching.py shared_inventory.py job_feeds.py
      - run: pytest -q
